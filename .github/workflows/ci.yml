name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: itp
          POSTGRES_USER: itp
          POSTGRES_PASSWORD: itp
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U itp -d itp"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      ITP_ENVIRONMENT: test
      ITP_LIVE_TRADING_ENABLED: "false"
      ITP_DATABASE_URL: postgresql+asyncpg://itp:itp@localhost:5432/itp
      ITP_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: MyPy
        run: mypy
      - name: Tests
        run: pytest -q
      - name: Bandit
        run: bandit -r src
      - name: Migration round trip
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Build container
        run: docker build -t institutional-trading-platform:test .
